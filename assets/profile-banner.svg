<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tu Nguyen — building TailPro</title>
  <desc id="desc">A dark banner with mint accents. Tu Nguyen, software developer. Logs. Context. Clarity. Currently building TailPro.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101C25"/>
      <stop offset="1" stop-color="#0C131B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#BCD6DD" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#background)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <rect x="0" y="42" width="4" height="276" rx="2" fill="#8DE3C0"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="68" fill="#A3B8C6" font-size="14" letter-spacing="3">TU NGUYEN / HUUTU2004</text>
    <text x="52" y="147" fill="#F2F6F8" font-size="62" font-weight="700" letter-spacing="-2">Logs. Context.</text>
    <text x="52" y="214" fill="#8DE3C0" font-size="62" font-weight="700" letter-spacing="-2">Clarity.</text>
    <text x="56" y="253" fill="#B3C4CE" font-size="19">Software developer. Building tools for debugging.</text>
    <rect x="56" y="284" width="256" height="34" rx="17" fill="#8DE3C0" fill-opacity=".09" stroke="#8DE3C0" stroke-opacity=".24"/>
    <circle cx="76" cy="301" r="4" fill="#8DE3C0"/>
    <text x="90" y="306" fill="#BDEEDB" font-size="13" letter-spacing=".5">CURRENTLY BUILDING TAILPRO</text>
  </g>
  <g transform="translate(812 77)">
    <rect width="332" height="207" rx="14" fill="#111E28" stroke="#2B414D"/>
    <path d="M0 40H332" stroke="#2B414D"/>
    <circle cx="20" cy="20" r="4" fill="#8DE3C0"/>
    <text x="34" y="24" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#A3B8C6" letter-spacing="1">TAILPRO / WORKFLOW</text>
    <g font-family="monospace" font-size="16">
      <text x="24" y="80" fill="#8DE3C0">01</text>
      <text x="65" y="80" fill="#E1EBF0">Connect over SSH</text>
      <text x="24" y="126" fill="#8DE3C0">02</text>
      <text x="65" y="126" fill="#E1EBF0">Find the context</text>
      <text x="24" y="172" fill="#8DE3C0">03</text>
      <text x="65" y="172" fill="#E1EBF0">Debug with evidence</text>
    </g>
    <path d="M34 90V105M34 136V151" stroke="#8DE3C0" stroke-opacity=".3" stroke-width="2"/>
  </g>
</svg>
